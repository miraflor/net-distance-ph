[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ph-net-distance"
version = "0.1.0"
description = "Reproducible Philippine municipality/city centroid road-and-ferry shortest-path distances"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ph-net-distance contributors" }]
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2"]
keywords = ["Philippines", "distance matrix", "routing", "OSM", "ferries", "PSGC"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: GIS"]

[project.optional-dependencies]
geo = ["geopandas>=1.0", "pyproj>=3.5", "pandas>=2.0", "openpyxl>=3.1", "requests>=2.31"]
transport = ["osmium>=4.0", "pyshp>=2.3,<3", "requests>=2.31"]
test = ["pytest>=8", "pyproj>=3.5", "pyshp>=2.3,<3"]
docs = ["mkdocs-material>=9.5"]

[tool.setuptools.packages.find]
include = ["ph_net_distance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# run.py, config.py and scripts/ live at the repository root and are not part
# of the installed package; this makes a bare `pytest` find them, not only
# `python -m pytest`.
pythonpath = ["."]
addopts = "-ra"
